name: Step 17 tests

on:
  push:
    paths:
      - step-17-testing-and-observability/**
      - .github/workflows/step-17-tests.yml
  pull_request:
    paths:
      - step-17-testing-and-observability/**
      - .github/workflows/step-17-tests.yml

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: step-17-testing-and-observability
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: step-17-testing-and-observability/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=1 --silent
      - run: npm run eval:retrieval -- --embedder test
