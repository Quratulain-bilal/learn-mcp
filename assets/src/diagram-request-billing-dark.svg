<rect x="910.0" y="250" width="14.700000000000045" height="52" rx="4" fill="#f38020" />
<text x="1152.5500000000002" y="283" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#8f9bc8" text-anchor="middle" >waiting on another API</text>
<rect x="1380.4" y="250" width="19.59999999999991" height="52" rx="4" fill="#f38020" />
<text x="420" y="332" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffc493" text-anchor="start" >orange: CPU work, 50 ms in all</text>
<text x="420.0" y="238" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#8f9bc8" text-anchor="middle" >0 ms</text>
<text x="665.0" y="238" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#8f9bc8" text-anchor="middle" >250 ms</text>
<text x="910.0" y="238" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#8f9bc8" text-anchor="middle" >500 ms</text>
<text x="1155.0" y="238" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#8f9bc8" text-anchor="middle" >750 ms</text>
<text x="1400.0" y="238" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#8f9bc8" text-anchor="middle" >1000 ms</text>
<text x="80" y="440" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="start" >Cloudflare Workers</text>
<text x="80" y="468" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#c9d1f5" text-anchor="start" >billed for CPU time</text>
<rect x="420" y="420" width="980" height="52" rx="10" fill="#20285a" stroke="#4b5794" stroke-width="1" stroke-dasharray="5 5"/>
<rect x="420.0" y="420" width="14.699999999999989" height="52" rx="4" fill="#f38020" />
<rect x="910.0" y="420" width="14.700000000000045" height="52" rx="4" fill="#f38020" />
<rect x="1380.4" y="420" width="19.59999999999991" height="52" rx="4" fill="#f38020" />
<text x="672.35" y="453" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#8f9bc8" text-anchor="middle" >waiting: not CPU time</text>
<text x="1152.5500000000002" y="453" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#8f9bc8" text-anchor="middle" >waiting: not CPU time</text>
<text x="1416" y="454" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#ffc493" text-anchor="start" >~50 ms</text>
<text x="80" y="580" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="start" >Google Cloud Run</text>
<text x="80" y="608" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#c9d1f5" text-anchor="start" >request-based billing</text>
<rect x="420" y="560" width="980" height="52" rx="10" fill="#8ea0ff" fill-opacity="0.85"/>
<text x="910.0" y="593" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" >allocated vCPU and memory, billed while the request is in progress</text>
<text x="1416" y="594" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#b9c4ff" text-anchor="start" >~1 s</text>
<rect x="80" y="680" width="1440" height="120" rx="16" fill="#141a3e" stroke="#4b5794" stroke-width="1" fill-opacity="0.7"/>
<text x="110" y="720" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="start" >This favours Workers for I/O-heavy MCP apps, but it is not the whole bill.</text>
<text x="110" y="752" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#c9d1f5" text-anchor="start" >Cloud Run shares an instance’s time across concurrent requests, both platforms charge per request, and both have free tiers.</text>
<text x="110" y="780" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#c9d1f5" text-anchor="start" >An app that needs more than 10 ms of CPU per request on Workers Free may still fit Cloud Run’s free tier. Check both for your own traffic.</text>
<text x="60" y="872" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#8f9bc8" text-anchor="start" >learn-mcp · the Agent Factory Stack · simplified: one request, no concurrency, before free tiers</text>
