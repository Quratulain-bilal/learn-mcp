<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Billing an MCP request</title><desc id="d">An illustrative one-second MCP tool call: 50 milliseconds of CPU work and 950 milliseconds waiting for the database and other services. On Cloudflare Workers you are billed for about 50 ms of CPU time plus the request. On Cloud Run with its default request-based billing, the instance’s allocated CPU and memory are billed for the whole second the request is in progress, rounded up to 100 ms, though concurrent requests on the same instance share that time. Free tiers apply on both. Not measured.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1227"/><stop offset="0.55" stop-color="#111735"/><stop offset="1" stop-color="#171a3f"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/></pattern>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8f9bc8"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f38020"/></marker>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/>
<text x="60" y="70" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffc493" text-anchor="start" letter-spacing="5">THE ECONOMICS OF WAITING</text><text x="60" y="132" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#ffffff" text-anchor="start" letter-spacing="-1">What you pay for in a one-second tool call</text><text x="62" y="174" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#8f9bc8" text-anchor="start" >An illustration, not a measurement: 50 ms of CPU work and 950 ms waiting on Neon and other APIs.</text>
<text x="80" y="284" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="start" >The request</text>
