<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 420' width='760' height='420' role='img' aria-labelledby='t d' font-family='Inter, sans-serif' font-size='13' xmlns:c2pa="http://c2pa.org/manifest"><title id='t'>The Dr. Gilsdorf method</title><desc id='d'>Improve to 9.5, review independently, then check again. Claude grades the work out of 10. A decision asks: 9.5 and checks pass? If no, Claude improves the work and grades again. If yes, other AIs review it. When the round limit is reached, the gaps are recorded and the work still goes to the other AIs. Claude revises using their reviews, then re-runs all checks. If a check fails, the work goes back to Claude to revise. When all pass, a person checks it in Step 5. A failed security, legal or safety check always blocks release.</desc><rect width='760' height='420' fill='#16181d'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f7480'/></marker></defs><text x='24' y='34' font-size='15' font-weight='600' fill='#ecedef' text-anchor='start'>Improve to 9.5, review independently, then check again</text><path d='M180.0 110H218' fill='none' stroke='#6f7480' stroke-width='1.25' marker-end='url(#a)'/><path d='M362 110H400.0' fill='none' stroke='#6f7480' stroke-width='1.25' marker-end='url(#a)'/><path d='M556.0 110H574.0' fill='none' stroke='#6f7480' stroke-width='1.25' marker-end='url(#a)'/><path d='M290 150V206.0' fill='none' stroke='#6f7480' stroke-width='1.25' marker-end='url(#a)'/><path d='M212.0 230H102V134.0' fill='none' stroke='#6f7480' stroke-width='1.25' marker-end='url(#a)'/><path d='M652 134.0V206.0' fill='none' stroke='#6f7480' stroke-width='1.25' marker-end='url(#a)'/><path d='M652 254.0V316.0' fill='none' stroke='#6f7480' stroke-width='1.25' marker-end='url(#a)'/><path d='M368.0 230H478V134.0' fill='none' stroke='#6f7480' stroke-width='1.25' marker-end='url(#a)'/><path d='M730.0 230H748V110H730.0' fill='none' stroke='#6f7480' stroke-width='1.25' marker-end='url(#a)'/><rect x='24.0' y='86.0' width='156' height='48' rx='8' fill='#1e2128' stroke='#6f7480' stroke-width='1.25'/><text x='102' y='114' font-size='13' font-weight='400' fill='#ecedef' text-anchor='middle'>Claude grades /10</text><polygon points='218,110 290,70 362,110 290,150' fill='#1e2128' stroke='#6f7480' stroke-width='1.25'/><text x='290' y='107' font-size='11.5' font-weight='400' fill='#ecedef' text-anchor='middle'>9.5 and</text><text x='290' y='123' font-size='11.5' font-weight='400' fill='#ecedef' text-anchor='middle'>checks pass?</text><rect x='400.0' y='86.0' width='156' height='48' rx='8' fill='#1e2128' stroke='#6f7480' stroke-width='1.25'/><text x='478' y='114' font-size='13' font-weight='400' fill='#ecedef' text-anchor='middle'>Other AIs review</text><rect x='574.0' y='86.0' width='156' height='48' rx='8' fill='#1e2128' stroke='#6f7480' stroke-width='1.25'/><text x='652' y='114' font-size='13' font-weight='400' fill='#ecedef' text-anchor='middle'>Claude revises</text><rect x='212.0' y='206.0' width='156' height='48' rx='8' fill='#1e2128' stroke='#6f7480' stroke-width='1.25'/><text x='290' y='234' font-size='13' font-weight='400' fill='#ecedef' text-anchor='middle'>Claude improves</text><rect x='574.0' y='206.0' width='156' height='48' rx='8' fill='#1e2128' stroke='#6f7480' stroke-width='1.25'/><text x='652' y='234' font-size='13' font-weight='400' fill='#ecedef' text-anchor='middle'>Re-run all checks</text><rect x='574.0' y='316.0' width='156' height='48' rx='8' fill='#1b2a3f' stroke='#6aa6ee' stroke-width='2'/><text x='652' y='344' font-size='13' font-weight='600' fill='#ecedef' text-anchor='middle'>A person checks</text><text x='381.0' y='102' font-size='11.5' font-weight='400' fill='#a4a8b1' text-anchor='middle'>yes</text><text x='300' y='182' font-size='11.5' font-weight='400' fill='#a4a8b1' text-anchor='start'>no</text><text x='157.0' y='222' font-size='11.5' font-weight='400' fill='#a4a8b1' text-anchor='middle'>grade again</text><text x='488' y='166' font-size='11.5' font-weight='400' fill='#a4a8b1' text-anchor='start'>round limit:</text><text x='488' y='182' font-size='11.5' font-weight='400' fill='#a4a8b1' text-anchor='start'>gaps recorded</text><text x='642' y='290' font-size='11.5' font-weight='400' fill='#a4a8b1' text-anchor='end'>all pass</text><text x='662' y='290' font-size='11.5' font-weight='400' fill='#a4a8b1' text-anchor='start'>Step 5</text><text x='742' y='162' font-size='11.5' font-weight='400' fill='#a4a8b1' text-anchor='end'>a check</text><text x='742' y='178' font-size='11.5' font-weight='400' fill='#a4a8b1' text-anchor='end'>fails</text><text x='652' y='390' font-size='11.5' font-weight='400' fill='#a4a8b1' text-anchor='end'>A failed security, legal or safety check always blocks release</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>