<title id="t">One language or two</title><desc id="d">Two ways to build the same MCP app. Python-based: a React UI in TypeScript, an MCP server and business logic in Python, and Postgres, so two language ecosystems with types and schemas defined twice. TypeScript-based: the React UI, the MCP server and the business logic all in TypeScript over Postgres, so one ecosystem in which tool schemas, types and validation are shared from the database to the screen.</desc>
