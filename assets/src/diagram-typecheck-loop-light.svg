<line x1="1146" y1="455.0" x2="1212" y2="455.0" stroke="#00b377" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="1180.0" y="441.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#047857" text-anchor="middle" >pass</text>
<path d="M610 374 C 610 260, 230 260, 230 370" fill="none" stroke="#f38020" stroke-width="2.5" marker-end="url(#aro)"/>
<rect x="300" y="222" width="240" height="56" rx="28" fill="#ffffff" stroke="#f38020" stroke-width="1.5" />
<text x="420" y="256" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#b45309" text-anchor="middle" >errors: Claude fixes them</text>
<path d="M990 536 C 990 650, 230 650, 230 540" fill="none" stroke="#5b6488" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#ar)"/>
<text x="610" y="642" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#5b6488" text-anchor="middle" >a failing test goes back to Claude too</text>
<text x="60" y="770" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#3b4470" text-anchor="start" >Type errors are the cheapest mistakes to catch: no deploy, no test data, no client. Python can do the same with Pyright or mypy and Pydantic,</text>
<text x="60" y="798" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#3b4470" text-anchor="start" >but in TypeScript the check is part of the normal build, so every learner and every agent runs it.</text>
<text x="60" y="872" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5b6488" text-anchor="start" >learn-mcp · the Agent Factory Stack · the typecheck script comes from step 1</text>
