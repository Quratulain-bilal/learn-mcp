<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">The type-check loop</title><desc id="d">The type check as a guardrail for a coding agent. Claude writes or changes code; npm run typecheck (wrangler types then tsc) checks every contract; if there are errors, Claude reads them and fixes the code, and the loop repeats; once the type check passes, the tests run, then a person reviews the diff in GitHub Desktop and commits.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#f5f7fc"/><stop offset="1" stop-color="#f4effd"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1b2550" stroke-opacity="0.05" stroke-width="1"/></pattern>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6488"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f38020"/></marker>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/>
<text x="60" y="70" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#b45309" text-anchor="start" letter-spacing="5">TYPESCRIPT BY DEFAULT</text><text x="60" y="132" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#0f1530" text-anchor="start" letter-spacing="-1">The compiler checks the agent’s work first</text><text x="62" y="174" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#5b6488" text-anchor="start" >When Claude writes most of the code, the type checker is a free reviewer that never gets tired. It runs before the tests and before you.</text>
<rect x="80" y="380" width="300" height="150" rx="18" fill="#eef0ff" stroke="#5b6cff" stroke-width="2" />
<text x="230.0" y="444" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#0f1530" text-anchor="middle" >Claude writes code</text>
<text x="230.0" y="480" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#3b4470" text-anchor="middle" >a tool, a query,</text>
<text x="230.0" y="502" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#3b4470" text-anchor="middle" >a widget</text>
<rect x="460" y="380" width="300" height="150" rx="18" fill="#fff4ea" stroke="#f38020" stroke-width="2" />
<text x="610.0" y="444" font-family="ui-monospace, SFMono-Regular, Menlo, 'DejaVu Sans Mono', monospace" font-size="26" font-weight="800" fill="#0f1530" text-anchor="middle" >npm run typecheck</text>
<text x="610.0" y="480" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#3b4470" text-anchor="middle" >wrangler types &amp;&amp; tsc</text>
<rect x="840" y="380" width="300" height="150" rx="18" fill="#e9fbf3" stroke="#00b377" stroke-width="2" />
<text x="990.0" y="444" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#0f1530" text-anchor="middle" >Tests</text>
<text x="990.0" y="480" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#3b4470" text-anchor="middle" >Vitest in the Workers</text>
<text x="990.0" y="502" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#3b4470" text-anchor="middle" >runtime</text>
<rect x="1220" y="380" width="300" height="150" rx="18" fill="#e9fbf3" stroke="#00b377" stroke-width="2" />
<text x="1370.0" y="444" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#0f1530" text-anchor="middle" >You review</text>
<text x="1370.0" y="480" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#3b4470" text-anchor="middle" >the diff in GitHub</text>
<text x="1370.0" y="502" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#3b4470" text-anchor="middle" >Desktop, then commit</text>
