<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 384' width='760' height='384' role='img' aria-labelledby='t d' font-family='Inter, sans-serif' font-size='13' xmlns:c2pa="http://c2pa.org/manifest"><title id='t'>The Panaversity AI Method: the environment</title><desc id='d'>Claude edits, you commit; in the cloud, Claude uses its own branch. Your local folder is your clone of the GitHub repo, the shared copy of the work; you clone and pull it. The Claude Project, with threads, edits the files in the local folder and never commits. GitHub Desktop shows the changes; you read the diff, commit and push by hand to the GitHub repo. You view and edit the files in VS Code. For cloud work, the Claude Project's cloud session runs long tasks on its own branch of the repo.</desc><rect width='760' height='384' fill='#16181d'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f7480'/></marker></defs><text x='24' y='34' font-size='15' font-weight='600' fill='#ecedef' text-anchor='start'>Claude edits, you commit; in the cloud, Claude uses its own branch</text><path d='M224 228H280' fill='none' stroke='#6f7480' stroke-width='1.25' marker-end='url(#a)'/><path d='M380 200V120' fill='none' stroke='#6f7480' stroke-width='1.25' marker-end='url(#a)' marker-start='url(#a)'/><path d='M480 228H536' fill='none' stroke='#6f7480' stroke-width='1.25' marker-end='url(#a)'/><path d='M560 192V150H440V120' fill='none' stroke='#6f7480' stroke-width='1.25' marker-end='url(#a)'/><path d='M536 92H480' fill='none' stroke='#6f7480' stroke-width='1.25' marker-end='url(#a)'/><path d='M124 200V92H280' fill='none' stroke='#6f7480' stroke-width='1.25' marker-end='url(#a)'/><path d='M380 256V328H536' fill='none' stroke='#6f7480' stroke-width='1.25' marker-end='url(#a)' marker-start='url(#a)'/><rect x='280.0' y='64' width='200' height='56' rx='8' fill='#1e2128' stroke='#6f7480' stroke-width='1.25'/><text x='380' y='88' font-size='13' font-weight='600' fill='#ecedef' text-anchor='middle'>GitHub repo</text><text x='380' y='106' font-size='11.5' font-weight='400' fill='#a4a8b1' text-anchor='middle'>The shared copy of the work</text><rect x='536.0' y='64' width='200' height='56' rx='8' fill='#1e2128' stroke='#6f7480' stroke-width='1.25'/><text x='636' y='88' font-size='13' font-weight='600' fill='#ecedef' text-anchor='middle'>Cloud session</text><text x='636' y='106' font-size='11.5' font-weight='400' fill='#a4a8b1' text-anchor='middle'>Long tasks, on its own branch</text><rect x='24.0' y='200' width='200' height='56' rx='8' fill='#1e2128' stroke='#6f7480' stroke-width='1.25'/><text x='124' y='224' font-size='13' font-weight='600' fill='#ecedef' text-anchor='middle'>Claude Project</text><text x='124' y='242' font-size='11.5' font-weight='400' fill='#a4a8b1' text-anchor='middle'>Threads; never commits</text><rect x='280.0' y='200' width='200' height='56' rx='8' fill='#1e2128' stroke='#6f7480' stroke-width='1.25'/><text x='380' y='224' font-size='13' font-weight='600' fill='#ecedef' text-anchor='middle'>Local folder</text><text x='380' y='242' font-size='11.5' font-weight='400' fill='#a4a8b1' text-anchor='middle'>Your clone of the repo</text><rect x='536.0' y='192' width='200' height='72' rx='8' fill='#1b2a3f' stroke='#6aa6ee' stroke-width='2'/><text x='636' y='216' font-size='13' font-weight='600' fill='#ecedef' text-anchor='middle'>GitHub Desktop</text><text x='636' y='234' font-size='11.5' font-weight='400' fill='#ecedef' text-anchor='middle'>You read the diff, commit</text><text x='636' y='250' font-size='11.5' font-weight='400' fill='#ecedef' text-anchor='middle'>and push by hand</text><rect x='536.0' y='300' width='200' height='56' rx='8' fill='#1e2128' stroke='#6f7480' stroke-width='1.25'/><text x='636' y='324' font-size='13' font-weight='600' fill='#ecedef' text-anchor='middle'>VS Code</text><text x='636' y='342' font-size='11.5' font-weight='400' fill='#a4a8b1' text-anchor='middle'>You view and edit files</text><text x='252' y='192' font-size='11.5' font-weight='400' fill='#a4a8b1' text-anchor='middle'>edits</text><text x='388' y='176' font-size='11.5' font-weight='400' fill='#a4a8b1' text-anchor='start'>clone, pull</text><text x='508' y='192' font-size='11.5' font-weight='400' fill='#a4a8b1' text-anchor='middle'>changes</text><text x='500' y='142' font-size='11.5' font-weight='400' fill='#a4a8b1' text-anchor='middle'>commit, push</text><text x='508' y='84' font-size='11.5' font-weight='400' fill='#a4a8b1' text-anchor='middle'>branch</text><text x='202' y='84' font-size='11.5' font-weight='400' fill='#a4a8b1' text-anchor='middle'>for cloud work</text><text x='458' y='320' font-size='11.5' font-weight='400' fill='#a4a8b1' text-anchor='middle'>view, edit</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>