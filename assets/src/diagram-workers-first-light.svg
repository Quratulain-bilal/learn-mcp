<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Workers first, containers when needed</title><desc id="d">Workers first, a container when needed. Claude and ChatGPT call your MCP server, a Cloudflare Worker that handles sign-in, tools and business rules and reaches Neon Postgres, KV, Queues and Workflows. Most tool calls stay in the Worker. Only a job that needs more than a Worker allows (over 128 MB of memory, native libraries, a full Linux filesystem or heavy CPU, such as converting large PDFs or video) goes to a Cloudflare Container that the Worker starts on demand. Containers need the Workers Paid plan and are not used in this bootcamp.</desc>
