<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Isolates or containers</title><desc id="d">Two ways to run the same MCP server, both fully managed and scaling to zero. Cloudflare Workers: Claude and ChatGPT call many lightweight V8 isolates inside one shared runtime on Cloudflare’s global network, each isolate one MCP server, all reaching Neon Postgres. Google Cloud Run: Claude and ChatGPT call a managed container in a region you pick, holding your MCP app, a full Node.js or Python runtime and any system libraries, reaching Neon Postgres. Workers are lighter; Cloud Run is more flexible.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#f5f7fc"/><stop offset="1" stop-color="#f4effd"/></linearGradient>
